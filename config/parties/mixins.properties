# ==============================================================================
# Parties Mixin Configuration
# WARNING: Only modify these if you are experiencing a crash or mod conflict.
# ==============================================================================

# Provides EntityMap/seenBy() access for party proximity checks regarding stat tracking.
#   Used by: UI
#   If Disabled: Defaults to marking players as distant, server-side tracking.
accessor.minecraft.chunk_map.entity_tracker=true

# Keeps track of spell ownership and intercepts spells in the hostile spell filter
#   Used by: Dynamics
#   If Disabled: Spells with no traceable owner and spells in the spell filter will affect allies.
compat.ironsspellbooks.allied_mechanics=true

# Hooks into the casting system to update casting states on the Party UI.
#   Used by: UI
#   If Disabled: The CastBar element will not work properly
compat.ironsspellbooks.cast=true

# Hooks into the mana system to update mana states on the Party UI.
#   Used by: UI
#   If Disabled: The Mana element will not work properly
compat.ironsspellbooks.mana=true

# Tracks the currently ticking Entity on the level. Used to determine MobEffect application sources.
#   Used by: Dynamics
#   If Disabled: Mob effects will usually not be traceable to the source entity automatically, preventing friendly-fire protection for mob effects.
minecraft.entity.tracker=true

# Intercepts alliance (isAlliedTo) mechanics for anything using the Team Alliance API.
#   Used by: Core, UI, Dynamics
#   If Disabled: Uses standard team alliance checks, unless modified externally.
minecraft.living_entity.allied_mechanics=true

# Negative mob effect checks for living entity application of allied team members. Also includes Iron's Spell Projectile support.
#   Used by: Core, UI, Dynamics
#   If Disabled: Ignores allied members for negative effect applications.
minecraft.living_entity.effects_check=true

# Intercepts character rendering and geometry for the Party UI and transparent models.
#   Used by: UI
#   If Disabled: Breaks 3D character rendering, label suppression, and ghost overlays in the Party UI.
minecraft.living_entity.renderer=true

# Tracks player ownership colors for UI, names, and loot via LocatorBar-style assignment.
#   Used by: Core, UI
#   If Disabled: Everyone's color is white.
minecraft.player.color=true

# Injects a custom party invite button into the vanilla Social Interactions screen.
#   Used by: UI
#   If Disabled: Removes the ability to invite players to a party directly from the social menu.
minecraft.player.social_entry=true

# Adds tooltip integration on the Party UI while the chat screen is open
#   Used by: UI
#   If Disabled: Tooltips no longer render in the Chat Screen for the party ui.
minecraft.screen.chat=true

