# Optional Mixin Toggles

# Provides EntityMap/seenBy() access for party proximity checks regarding stat tracking.
#   Used by: Parties
#   If Disabled: Defaults to marking players as distant, server-side tracking.
accessor.minecraft.chunk_map.entity_tracker=true

# Provides LivingEntity access for party health updates.
#   Used by: Parties
#   If Disabled: Breaks any health updates and tracking for the Party UI.
mixin.minecraft.living_entity_health_effects=true

# Keeps track of spell ownership for the given spell entity to figure out alliance mechanics.
#   Used by: Parties: Dynamics
#   If Disabled: Spells with no traceable owner will affect allies.
mixin.ironsspellbooks.entity.spell_ownership=true

# Intercepts targeted spells utilizing a hostile spell filter, passing it through an Alliance check.
#   Used by: Parties: Dynamics
#   If Disabled: Targeted hostile spells could still be cast on allies.
mixin.ironsspellbooks.entity.allied_mechanics=true

# Provides Online tracking hooks for the Party UI
#   Used by: Parties
#   If Disabled: Breaks online-tracking UI updates for the Party UI.
mixin.minecraft.online_state=true

# Intercepts incoming packets to synchronize health, attributes, and mob effects.
#   Used by: Parties
#   If Disabled: Breaks synchronization of health, stats, and mob effects in the Party UI.
mixin.minecraft.client_packet_listener=true

# Intercepts alliance (isAlliedTo) mechanics for anything using the Team Alliance API.
#   Used by: LyteCore, Parties, Parties: Dynamics, Parties: Encounters & Loot
#   If Disabled: Uses standard team alliance checks, unless modified externally.
mixin.minecraft.entity.allied_mechanics=true

# Overrides armor and entity render materials to enforce translucency.
#   Used by: Parties
#   If Disabled: Causes ghost party members to render fully opaque instead of with the intended translucency.
mixin.minecraft.render_type=true

# Provides AttributeMap access for party attribute syncing.
#   Used by: Parties
#   If Disabled: Breaks any attribute-related UI update for the Party UI.
mixin.minecraft.attribute_map=true

# Provides FoodData access for party saturation/hunger updates.
#   Used by: Parties
#   If Disabled: Breaks any food-related UI updates for the Party UI.
mixin.minecraft.food_data=true

# Allows access to ItemEntity's age value for loot despawn overrides.
#   Used by: Parties: Encounters & Loot
#   If Disabled: Only overrides ItemEntity age when set to infinite.
accessor.minecraft.item_entity.age=true

# Tracks player ownership colors for UI, names, and loot via LocatorBar-style assignment.
#   Used by: LyteCore, Parties, Parties: Encounters & Loot
#   If Disabled: Everyone's color is white.
mixin.minecraft.player.player_color=true

# Adds tooltip integration on the Party UI while the chat screen is open
#   Used by: Parties
#   If Disabled: Tooltips no longer render in the Chat Screen for the party ui.
mixin.minecraft.chat_screen=true

# Disables extra text rendering on entities when rendering the player in the Party UI.
#   Used by: Parties
#   If Disabled: Allows flat text to render on the player in the party UI, which is only visible at certain angles.
mixin.minecraft.living_entity.text_render=true

# Enables client-side synchronization for health and absorption across party members nearby.
#   Used by: Parties
#   If Disabled: Forces separate, server-sided information packets
mixin.minecraft.synched_entity_data=true

# Intercepts character rendering and geometry for the Party UI and transparent models.
#   Used by: Parties
#   If Disabled: Breaks 3D character rendering and ghost overlays in the Party UI.
mixin.minecraft.living_entity.renderer=true

# Intercepts local player experience updates to sync with the party data handler.
#   Used by: Parties
#   If Disabled: Prevents the local player's XP bar from syncing and updating within the Party UI.
mixin.minecraft.local_player.xp=true

# Injects a custom party invite button into the vanilla Social Interactions screen.
#   Used by: Parties
#   If Disabled: Removes the ability to invite players to a party directly from the social menu.
mixin.minecraft.social.player_entry=true

# Links player instances to food/attribute data and sends out experience and absorption updates for server-sided party syncing.
#   Used by: Parties
#   If Disabled: Stops the server from tracking and broadcasting experience, food, and absorption changes to the party.
mixin.minecraft.player.sync=true

# Negative mob effect checks for living entity application of allied team members. Also includes Iron's Spell Projectile support.
#   Used by: LyteCore, Parties, Parties: Dynamics
#   If Disabled: Ignores allied members for negative effect applications.
mixin.minecraft.living_entity.effects_check=true

# Tracks the currently ticking Entity on the level. Used to determine MobEffect application sources.
#   Used by: Parties: Dynamics
#   If Disabled: Mob effects will usually not be traceable to the source entity automatically, preventing friendly-fire protection for mob effects.
mixin.minecraft.level.tick_entity_tracker=true

